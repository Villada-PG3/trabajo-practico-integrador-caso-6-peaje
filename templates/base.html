<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Peaje{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">

    <!-- Navbar del Operador -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 no-print">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-road-barrier"></i> Estación de Peaje</a>
        <div class="ms-auto text-white d-flex align-items-center gap-3">
            <span id="user-info" class="badge bg-secondary p-2"><i class="fa-solid fa-user-gear"></i> Legajo: <strong id="lbl-legajo">---</strong></span>
            <span id="turno-info" class="badge bg-info text-dark p-2"><i class="fa-solid fa-cash-register"></i> Casilla: <strong id="lbl-casilla">---</strong></span>
            <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap & Tesseract JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
