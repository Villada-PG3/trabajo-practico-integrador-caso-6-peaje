{% extends 'base.html' %}

{% block title %}Apertura de Turno{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fa-solid fa-door-open me-2"></i>Apertura de Turno y Caja</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted">Ingrese los datos correspondientes para habilitar la casilla de cobro.</p>
                
                <div id="apertura-alert" class="alert alert-danger d-none" role="alert"></div>

                <form id="form-apertura">
                    <div class="mb-3">
                        <label for="ruta-select" class="form-label">Ruta</label>
                        <select class="form-select" id="ruta-select" required>
                            <option value="" selected disabled>Seleccione una ruta</option>
                            {% for ruta in rutas %}
                            <option value="{{ ruta.id_ruta }}">{{ ruta.nombre }}</option>
                            {% empty %}
                            <option value="" disabled>No hay rutas con casillas cargadas</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="casilla-select" class="form-label">Casilla Asignada</label>
                        <select class="form-select" id="casilla-select" required disabled>
                            <option value="" selected disabled>Seleccione primero una ruta</option>
                            {% for casilla in casillas %}
                            <option value="{{ casilla.id_casilla }}" data-ruta-id="{{ casilla.estacion.ruta_id }}" hidden>
                                Casilla {{ casilla.numero_casilla|stringformat:"02d" }} - {{ casilla.estacion.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="sentido" class="form-label">Sentido de Cobro</label>
                        <select class="form-select" id="sentido" required>
                            <option value="NS">Norte -> Sur (Hacia Córdoba)</option>
                            <option value="SN">Sur -> Norte (Hacia Carlos Paz)</option>
                            <option value="EO">Este -> Oeste</option>
                            <option value="OE">Oeste -> Este</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="monto-inicial" class="form-label">Monto de Cambio Inicial ($)</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" id="monto-inicial" value="5000.00" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100" id="btn-apertura">
                        <i class="fa-solid fa-play me-2"></i> Iniciar Turno de Cobro
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const rutaSelect = document.getElementById('ruta-select');
const casillaSelect = document.getElementById('casilla-select');

rutaSelect.addEventListener('change', function() {
    const rutaId = this.value;
    let hayCasillas = false;

    casillaSelect.value = '';
    Array.from(casillaSelect.options).forEach(function(option) {
        if (!option.dataset.rutaId) return;
        option.hidden = option.dataset.rutaId !== rutaId;
        if (!option.hidden) hayCasillas = true;
    });

    casillaSelect.disabled = !hayCasillas;
});

document.getElementById('form-apertura').addEventListener('submit', async function(e) {
    e.preventDefault();

    const boton = document.getElementById('btn-apertura');
    const alerta = document.getElementById('apertura-alert');
    alerta.classList.add('d-none');
    boton.disabled = true;

    let res;
    try {
        res = await apiFetch('/api/turnos/abrir/', {
            method: 'POST',
            body: {
                ruta_id: rutaSelect.value,
                casilla_id: casillaSelect.value,
                sentido: document.getElementById('sentido').value,
                monto_cambio_inicial: document.getElementById('monto-inicial').value
            }
        });
    } catch (err) {
        res = { ok: false, status: 0, data: { detail: 'No se pudo conectar con el servidor.' } };
    }

    if (!res.ok) {
        // Ya no se avanza "como si nada": si el turno no se guardó, se avisa
        alerta.textContent = mensajeError(res);
        alerta.classList.remove('d-none');
        boton.disabled = false;
        return;
    }

    window.location.href = '/cobro/';
});
</script>
{% endblock %}
