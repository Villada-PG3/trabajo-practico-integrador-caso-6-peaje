{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Sistema de Peajes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body class="login-bg d-flex align-items-center justify-content-center">

<div class="card shadow" style="width: 100%; max-width: 380px;">
  <div class="card-body p-4">

    <h1 class="h4 mb-1">Sistema de Peajes</h1>
    <p class="text-muted mb-4">Ingresá con tu legajo y contraseña.</p>

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label for="legajo" class="form-label">Número de legajo</label>
        <input type="text" class="form-control" id="legajo" name="legajo" placeholder="Ej. 4521" autofocus>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••">
      </div>

      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}

      <button type="submit" class="btn btn-peaje w-100">Ingresar</button>
    </form>

  </div>
</div>

</body>
</html>
